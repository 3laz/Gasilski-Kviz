<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasilska akademija</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Strip: debele črne obrobe, polton ozadje, močne barve. Postavitev: ena stolpec, velike tipke za prste. */
:root{
  --ink:#1b1830; --red:#d42a17; --yellow:#ffcf30; --blue:#1c74d9; --green:#18803f; --orange:#ff8a1f; --wrong:#b3200f;
  --sky:#d6f0ff; --paper:#ffffff; --soft:#fff3c4;
  --display:'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--sky);
  background-image:radial-gradient(rgba(28,116,217,.2) 1.6px,transparent 1.8px);
  background-size:14px 14px;
  color:var(--ink);
  font-family:var(--display);font-weight:500;font-size:18px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px}
.panel.yellow{background:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  font:inherit;font-weight:800;font-size:1.1rem;color:var(--ink);background:var(--yellow);
  border:4px solid var(--ink);border-radius:14px;padding:11px 16px;box-shadow:4px 4px 0 var(--ink);
  cursor:pointer;touch-action:manipulation;text-align:center;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.white{background:#fff}
.btn.big{font-size:1.4rem;padding:14px 18px;width:100%}
.btn.small{font-size:.95rem;padding:8px 14px;min-height:44px;box-shadow:3px 3px 0 var(--ink);border-width:3px}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

/* Naslov */
.logo{text-align:center}
.logo h1{
  font-weight:800;font-size:clamp(2.1rem,10vw,3.4rem);line-height:.95;color:var(--yellow);
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 var(--red);
  transform:rotate(-2deg);letter-spacing:.5px;text-transform:uppercase;margin:6px 0 0;
}
.logo .sub{display:inline-block;margin-top:10px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 12px;font-weight:800;transform:rotate(1.5deg)}

/* Oder z maskotoma */
.stagewrap{position:relative}
.stagewrap.sm{width:min(100%,250px);margin:0 auto}
@media(min-width:520px){.stagewrap.sm{width:min(100%,340px)}}
.sm .stage{box-shadow:4px 4px 0 var(--ink)}
.sm .burst{width:92px;height:80px;margin-left:-46px;top:-6%}
.sm .burst span{font-size:1rem}
.stage{display:block;width:100%;height:auto;background:#bfe6ff;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink)}
.stage .ground{stroke:var(--ink);stroke-width:4}
.fl{transform:translate(292px,160px) scale(var(--to,1))}
.fl.anim{animation:shrink .8s ease-out forwards}
@keyframes shrink{from{transform:translate(292px,160px) scale(var(--from,1))}to{transform:translate(292px,160px) scale(var(--to,1))}}
.flick{animation:flick .55s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.94,1.07)}}
.flare{animation:flare .45s ease-in-out 2}
@keyframes flare{50%{transform:scale(1.25,1.2)}}
.jet{fill:none;stroke:var(--blue);stroke-width:10;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:jetdraw .45s ease-out forwards}
.jet2{stroke:#bfe6ff;stroke-width:3.2}
@keyframes jetdraw{to{stroke-dashoffset:0}}
.spark{fill:#ffcf30;stroke:#1b1830;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:rise 1.7s ease-out infinite}
@keyframes rise{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,0px),-34px) scale(.3);opacity:0}}
.drop{fill:#1c74d9;stroke:#1b1830;stroke-width:1.6;animation:drip .8s ease-out .35s both}
@keyframes drip{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.puff{fill:#fff;stroke:#1b1830;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:puff 1s ease-out .4s both}
@keyframes puff{0%{transform:translateY(0) scale(.3);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.2);opacity:0}}
.smoke circle{fill:#e1e5ea;stroke:#1b1830;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:smoke 3s ease-in-out infinite}
@keyframes smoke{0%{transform:translateY(8px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.15);opacity:0}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:18px}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border:2px solid var(--ink);animation:fall 2.6s linear both}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
.badgepop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
.rk.lock .bdg{filter:grayscale(1)}
.meds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.med svg{max-width:100%;height:auto}
.med{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1}
.med b{font-size:.8rem;font-weight:800;overflow-wrap:anywhere}.med small{font-size:.8rem;font-weight:700}
.medst{font-size:.95rem;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;letter-spacing:1px;margin-top:2px}
.burst{position:absolute;left:50%;top:-4%;width:130px;height:112px;margin-left:-65px;pointer-events:none;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1.45rem;color:var(--red);transform:rotate(-8deg);text-align:center;line-height:1}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* Zgornja vrstica */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pips{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.pip{width:21px;height:21px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;line-height:1}
.pip.done{background:var(--green);color:#fff} .pip.bad{background:var(--orange);color:var(--ink)} .pip.now{background:var(--yellow);transform:scale(1.2)}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;white-space:nowrap}

.rprog{position:relative;display:flex;gap:10px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:6px 12px;box-shadow:4px 4px 0 var(--ink)}
.rprog .rl{font-weight:800;font-size:.95rem;line-height:1.15}
.rprog .bar{height:14px;border-width:3px;margin-top:4px}
.rprog .bar i{border-right-width:3px}
.rprog .bar i.grow{animation:grow .8s ease-out both}
@keyframes grow{from{width:var(--f)}to{width:var(--t)}}
.plus{position:absolute;right:14px;top:-14px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:800;animation:plusup 1.3s ease-out both}
@keyframes plusup{0%{transform:translateY(10px) scale(.5);opacity:0}25%{transform:translateY(0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.mk{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;border:3px solid var(--ink);color:#fff;font-size:.9em;margin-right:6px;vertical-align:middle;line-height:1}
.bubble.good .mk{background:var(--green)}.bubble.bad .mk{background:var(--wrong)}
summary.btn{list-style:none;display:block}summary.btn::-webkit-details-marker{display:none}
details.more[open] summary.btn{background:var(--yellow)}
.morebody{display:flex;flex-direction:column;gap:12px;margin-top:12px}
/* Topografski znaki */
.tmap{display:block;width:100%;height:auto;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink)}
.thit{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}
path.thit{fill:none}
.thit:hover{fill:rgba(28,116,217,.14)}path.thit:hover{fill:none;stroke:rgba(28,116,217,.28)}
.hlpo{fill:none;stroke:#1b1830;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}.hlpy{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.hlro{fill:none;stroke:#1b1830;stroke-width:7}.hlry{stroke-width:3.5}
.hlok .hlpy{stroke:#ffcf30}.hlok .hlry{fill:#ffcf30;stroke:#ffcf30}
.hlbad .hlpy{stroke:#ff9d7a}.hlbad .hlry{fill:#ffd2ae;stroke:#b3200f}.hlbad .hlpo{stroke:#b3200f}
.thit:focus{outline:none}.thit:focus-visible{stroke:var(--blue);fill:rgba(28,116,217,.14)}
.tdone .thit{cursor:default;pointer-events:none}
.ring{fill:none;stroke-linecap:round}
.symopt{display:block;max-width:100%;height:auto;margin:0 auto}
.opt.symo{justify-content:flex-start}.opt.symo .symopt{flex:1}
.symbox{display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;min-height:64px}
.symbox svg{display:block;height:auto;max-width:100%}
.s1chip{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:800;font-size:.9rem;background:#fff}
/* Vprašanje */
.tag{display:inline-block;border:3px solid var(--ink);border-radius:8px;padding:0 10px;font-weight:800;font-size:.9rem;transform:rotate(-2deg)}
.qcard{position:relative}
.qcard::before{content:"";position:absolute;left:34px;top:-18px;width:26px;height:26px;background:#fff;border-left:4px solid var(--ink);border-top:4px solid var(--ink);transform:rotate(45deg);border-radius:4px 0 0 0}
.qrow{display:flex;gap:12px;align-items:center;margin-top:10px}
.qtext{font-size:1.5rem;font-weight:800;line-height:1.25;flex:1;min-width:0}
.qtext:focus{outline:none}
.qicon{flex:none;line-height:1;display:flex;align-items:center;justify-content:center;min-width:56px}
.nov{margin-top:8px}
.team-banner{border:4px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:800;color:#fff;text-align:center;font-size:1.25rem;box-shadow:4px 4px 0 var(--ink)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;font-weight:700;font-size:1.3rem;line-height:1.2;min-height:62px;
  color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;
}
.opt .let{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.25rem}
.opt:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:#b9f0cf}.opt.right .let{background:var(--green);font-size:1.6rem}
.opt.wrong{background:#ffd2ae}.opt.wrong .let{background:var(--wrong);font-size:1.6rem}
.opt.dim{background:#eceef3;color:#5a566b;border-color:#8b88a0;box-shadow:none}.opt.dim .let{background:#6d6a80}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Pogovorni oblački */
.bubble{position:relative;border:4px solid var(--ink);border-radius:18px;padding:12px 16px;background:#fff;box-shadow:5px 5px 0 var(--ink)}
.bubble.good{background:#c9f5da}.bubble.bad{background:#ffe1c7}
.bubble h3{font-size:1.35rem;font-weight:800}
.bubble .fact{margin-top:8px}
.bubble .ans{margin-top:6px;font-weight:800}
.bonus{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;margin-top:6px;transform:rotate(-2deg)}

/* Čin */
.rankcard{display:flex;gap:14px;align-items:center}
.bar{height:20px;border:4px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-right:4px solid var(--ink)}
.bar.g i{background:var(--green)}
.rk{display:flex;align-items:center;gap:12px;padding:8px 12px;border:4px solid var(--ink);border-radius:14px;background:#fff}
.rk.lock{opacity:.78;background:#eee}
.rk.cur{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}
.rk b{font-size:1.2rem}

/* Teme */
.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{font:inherit;text-align:left;border:4px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;touch-action:manipulation}
.topic:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.topic b{font-size:1.15rem;font-weight:800}
.topic small{font-size:.9rem;font-weight:700}
.topic .bar{height:14px;border-width:3px;background:rgba(255,255,255,.85)}
.topic .bar i{background:var(--ink);border-right:0}

/* Obrazci */
input[type=text]{font:inherit;font-weight:700;font-size:1.15rem;padding:9px 12px;border:4px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
textarea{font:inherit;font-weight:600;font-size:1rem;padding:9px 12px;border:4px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-height:140px;resize:vertical}
label{font-weight:800;display:block;margin-bottom:4px}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;box-shadow:3px 3px 0 var(--ink);padding:8px}
.seg .btn.on{background:var(--red);color:#fff}
.note{font-size:.95rem;font-weight:500;opacity:.85}
.stars{font-size:3rem;line-height:1;letter-spacing:4px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-align:center}
.stars .on{color:var(--yellow)}.stars .off{color:#fff}
.center{text-align:center}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{border:3px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);font-weight:800;margin-right:8px}
.codebox{display:flex;gap:8px}
.status{min-height:1.4em;font-weight:700;color:var(--green)}
.ep{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .fl.anim{transform:translate(290px,152px) scale(var(--to,1))}
}
</style>
</head>
<body>
<noscript><div class="wrap"><div class="panel">Za igro potrebuješ vklopljen JavaScript.</div></div></noscript>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#e8f7ff"/></linearGradient>
<linearGradient id="gSkyW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#fff4d4"/></linearGradient>
<linearGradient id="gJ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a9af2"/><stop offset="1" stop-color="#1459b3"/></linearGradient>
<linearGradient id="gH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a4d"/><stop offset="1" stop-color="#c91f0e"/></linearGradient>
<radialGradient id="gSk" cx=".4" cy=".35" r=".85"><stop offset="0" stop-color="#ffe6cb"/><stop offset="1" stop-color="#f0b387"/></radialGradient>
<linearGradient id="gF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb21f"/><stop offset=".5" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ee2b12"/></linearGradient>
<linearGradient id="gF2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff6b8"/><stop offset="1" stop-color="#ffcf30"/></linearGradient>

</defs></svg>
<div class="wrap" id="app"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
/* Vprašanja: [tema, vprašanje, pravilni odgovor, [napačna1, napačna2], "Zapomni si"] */
const RAW = [
/* ---------- GASILSTVO (Veš – ne veš) ---------- */
["g","Koliko let imajo pionirji gasilci?","Od 7 do 11 let",["Od 3 do 5 let","Od 12 do 16 let"],"Pionirji so stari od 7 do 11 let. Mladinci pa od 12 do 16 let."],
["g","Koliko let imajo mladinci gasilci?","Od 12 do 16 let",["Od 7 do 11 let","Od 20 do 30 let"],"Mladinci imajo od 12 do 16 let. Ko odrasteš, postaneš pripravnik."],
["g","Kdo je gasilec pripravnik?","Član društva, star od 16 do 18 let, ki se uči za gasilca",["Član društva, star 5 let","Gasilec, ki je že v pokoju"],"Pripravnik je lahko tudi starejši od 18 let, dokler se še usposablja za operativnega gasilca."],
["g","Ali lahko tujec postane član prostovoljnega gasilskega društva (PGD)?","Da, pod enakimi pogoji kot Slovenci",["Ne, nikoli","Samo če ima gasilski avto"],"Gasilci pomagamo vsem. Tudi član društva lahko postane vsak, ki izpolnjuje pogoje."],
["g","Kaj je simbol prostovoljnega gasilstva?","Gasilski znak in prapor",["Čebela in panj","Zastava s sladoledom"],"Simbola sta gasilski znak in prapor."],
["g","Katera od teh je naravna nesreča?","Potres",["Pokvarjen likalnik","Prazen hladilnik"],"Naravne nesreče so potres, poplava, neurje, zmrzal, suša, plazovi, toča, vihar, žled in kužne bolezni."],
["g","Katera od teh je naravna nesreča?","Poplava",["Šolski odmor","Pokvarjen telefon"],"Poplava je naravna nesreča. Prav tako potres, suša, toča in žled."],
["g","Zakaj se ob potresu ne smemo zadrževati na stopnišču?","Ker se lahko zruši",["Ker je tam prehladno","Ker se tam izgubimo"],"Stopnišče se ob potresu rado poruši, zato ga ne uporabljamo za skrivališče."],
["g","Katero številko pokličemo, ko vidimo, da gori?","112",["113","123"],"Ko gori, pokliči 112!"],
["g","Kaj povemo, ko pokličemo 112?","Kdo kliče, kaj se je zgodilo, kje in koliko je ponesrečencev",["Samo svoje ime in razred","Kaj smo jedli za kosilo"],"Povej še, kakšne so poškodbe, kakšne so razmere na kraju in kakšno pomoč potrebuješ."],
["g","Kateri trije deli sestavljajo trikotnik gorenja?","Gorljiva snov, kisik in toplota",["Voda, zrak in zemlja","Les, papir in sladkor"],"Če odvzameš enega od treh, ogenj ugasne."],
["g","Kaj je gorljiva snov?","Snov, ki gori",["Snov, ki se topi v vodi","Snov, ki je vedno mokra"],"Gorljiva je vsaka snov, ki gori, kadar so izpolnjeni pogoji za gorenje."],
["g","V katerih stanjih so lahko gorljive snovi?","V trdnem, tekočem in plinastem",["Samo v trdnem","Samo v tekočem"],"Gori lahko les (trdno), bencin (tekoče) in plin (plinasto)."],
["g","Kateri gospodinjski aparati najpogosteje povzročijo požar?","Pokvarjeni električni aparati, na primer likalnik ali kuhalnik",["Aparati, ki so izklopljeni iz vtičnice","Papirnata vrečka"],"Najbolj nevarni so električni aparati v okvari: kuhalnik, likalnik, električne peči."],
["g","Koga najprej umaknemo iz gorečega stanovanja?","Ljudi in živali",["Televizijo","Pohištvo"],"Življenja so vedno pomembnejša od stvari!"],
["g","Kako razvrščamo požare glede na obseg?","Mali, večji, veliki in katastrofalni",["Rdeči, modri in zeleni","Kratki, dolgi in široki"],"Po obsegu so požari mali, večji, veliki in katastrofalni."],
["g","Kako delimo požare glede na kraj gorenja?","Notranji, zunanji, kombinirani in požari v naravi",["Dnevni in nočni","Hladni in topli"],"Požar je lahko v stavbi (notranji), zunaj, kombiniran ali v naravi."],
["g","Koliko razredov požarov poznamo?","Štiri: A, B, C in D",["Dva: A in B","Deset"],"Razredi požarov so A, B, C in D. Razred je odvisen od tega, kaj gori."],
["g","Požari razreda A so požari ...","trdnih snovi (les, seno, obleka)",["tekočin (bencin, olje)","plinov (propan, butan)"],"A kot „Aaa, les gori!“ Razred A so trdne snovi."],
["g","Požari razreda B so požari ...","tekočin (bencin, olje, nafta, alkohol)",["trdnih snovi (les, seno)","lahkih kovin (aluminij)"],"B kot „bencin“. Razred B so gorljive tekočine."],
["g","Požari razreda C so požari ...","gorljivih plinov (zemeljski plin, propan, butan)",["tekočin (bencin, olje)","trdnih snovi (les, seno)"],"Razred C so plini: zemeljski plin ali metan, propan, butan, vodik, acetilen, amonijak."],
["g","Požari razreda D so požari ...","lahkih kovin (aluminij, magnezij)",["plinov (propan, butan)","trdnih snovi (les, seno)"],"Razred D so lahke kovine, na primer aluminij in magnezij."],
["g","Katero gasilno sredstvo je najcenejše in najbolj razširjeno?","Voda",["Mleko","Sok"],"Voda je najcenejše gasilno sredstvo, zato jo gasilci uporabljajo najpogosteje."],
["g","Kako delimo gasilske cevi glede na premer?","A, B, C in D",["S, M, L in XL","1, 2, 3 in 4"],"Po premeru so cevi A, B, C in D."],
["g","Katere vrste gasilskih cevi poznamo?","Sesalne, tlačne in visokotlačne",["Mokre, suhe in sladke","Dolge, kratke in okrogle"],"Sesalne, tlačne in visokotlačne cevi."],
["g","Za kaj uporabljamo gasilske spojke?","Za spajanje cevi in gasilskih armatur",["Za pripenjanje čelade","Za zapenjanje jakne"],"Spojke spajajo sesalne in tlačne cevi ter armature, na primer ročnik in trojak."],
["g","Kaj je gasilski prapor?","Simbol društva iz svilene tkanine z zlato vrvico",["Gasilska piščalka","Vrsta gasilne cevi"],"Prapor ima izvezene simbole društva. Uporabljamo ga ob svečanih dogodkih in za predstavitev društva."],
["g","Koliko pionirjev tekmuje pri vaji z vedrovko?","Devet",["Pet","Dvanajst"],"Pri vedrovki tekmuje devet pionirjev."],
["g","Kako imenujemo tekmovalce z rumenimi oznakami pri vedrovki?","Cevarji",["Napadalci","Vodarji"],"Rumeni so cevarji, rdeči napadalci, modri vodarji."],
["g","Kako imenujemo tekmovalce z rdečimi oznakami pri vedrovki?","Napadalci",["Cevarji","Vodarji"],"Rdeči so napadalci. Rumeni so cevarji, modri vodarji."],
["g","Kako imenujemo tekmovalce z modrimi oznakami pri vedrovki?","Vodarji",["Cevarji","Napadalci"],"Modra kot voda. Modri so vodarji."],
["g","Koliko vode je v enem vedru pri vedrovki?","5 litrov",["1 liter","20 litrov"],"V enem vedru je 5 litrov vode."],
["g","Katero povelje zakliče tekmovalec, ki z mlazom meri v tarčo pri vedrovki?","„Voda!“",["„Ogenj!“","„Stoj!“"],"Tisti, ki meri s curkom v tarčo, zakliče: „Voda!“"],
["g","Kako morajo biti oblečeni tekmovalci pri kvizu?","V gasilsko delovno obleko",["V pižamo","V kopalke"],"Tekmovalci nosijo gasilsko delovno obleko."],
["g","Kakšen ročnik predajajo pionirji pri štafeti?","Navadni D-ročnik",["Zlati ročnik","Gasilno cev"],"Pri štafeti pionirji predajajo navadni D-ročnik."],
["g","Koliko gasilskih regij je v Sloveniji?","17",["5","50"],"V Sloveniji je 17 gasilskih regij."],
["g","Kdo voli poveljnika in predsednika PGD?","Občni zbor",["Župan","Dežurni kuhar"],"Poveljnika in predsednika društva izvoli občni zbor."],
["g","Kako je organizirano gasilstvo v Sloveniji?","V prostovoljnih in poklicnih gasilskih organizacijah",["Samo v poklicnih","Samo v šolah"],"Imamo prostovoljne in poklicne gasilce."],
["g","Koliko prostovoljnih gasilskih društev je v Sloveniji?","Okoli 1300",["Okoli 13","Okoli 130 000"],"V Sloveniji je okoli 1300 prostovoljnih gasilskih društev."],
["g","Kje registriramo gasilsko društvo?","Na upravni enoti",["V trgovini","Na pošti"],"Gasilsko društvo registriramo na upravni enoti."],
["g","Kje na gasilski uniformi nosimo oznake činov?","Na naramniku",["Na čeladi","Na čevljih"],"Čin se vidi na naramniku."],
["g","Na katerem rokavu delovne obleke nosimo znak gasilske organizacije?","Na levem",["Na desnem","Na čeladi"],"Znak pripadnosti gasilski organizaciji je na levem rokavu."],
["g","Kako gasilci pozdravljajo?","Z roko in z obračanjem glave",["S klobukom","Z mahanjem z obema rokama"],"Gasilski pozdrav: roka in obrat glave."],
["g","S katero nogo začnemo premikanje pri vaji razvrščanja?","Z levo nogo",["Z desno nogo","Z obema hkrati"],"Pri razvrščanju začnemo z levo nogo."],
["g","Katere vrste radijskih postaj poznamo?","Ročne, mobilne in stabilne",["Rdeče, modre in zelene","Hitre in počasne"],"Radijske postaje so ročne, mobilne in stabilne."],
["g","Kako se imenuje informacijski sistem za evidence prostovoljnih gasilcev?","Vulkan",["Orkan","Strela"],"Gasilske evidence vodimo v sistemu Vulkan."],
["g","Kaj je evakuacija?","Organiziran umik ljudi na varno mesto",["Gašenje s helikopterjem","Vaja z vedrovko"],"Evakuacija je organiziran umik ljudi na varno mesto ob požaru ali drugi nevarnosti."],
["g","Kaj pomeni črka X na opozorilni tabli vozila?","Snov nevarno reagira z vodo",["Snov je zelo težka","Snov je zelo hladna"],"X pomeni: ne gasi z vodo!"],
["g","Koliko časa je potrebna požarna straža?","Dokler je prisotna požarna nevarnost",["Točno eno uro","Do kosila"],"Požarna straža bdi, dokler obstaja nevarnost požara."],
["g","S čim lahko gasimo katastrofalni požar v naravi?","S helikopterji in letali, ki prevažajo vodo",["S sesalcem","S snežnimi kepami"],"Veliki požari v naravi se gasijo tudi iz zraka."],

["g","Kaj je gasilnik ali gasilni aparat?","Naprava za gašenje začetnih požarov",["Naprava za sušenje las","Čelada z lučjo"],"Z gasilnikom pogasimo požar, ko je še majhen."],

/* ---------- PRVA POMOČ ---------- */
["p","Kaj je prva pomoč?","Ukrepi, s katerimi pomagamo poškodovanemu, preden pridejo reševalci",["Zdravljenje v bolnišnici","Nakup zdravil v lekarni"],"Prvo pomoč nudimo pred prihodom reševalcev."],
["p","Kaj potrebujemo za prvo pomoč?","Preproste pripomočke, na primer torbico prve pomoči",["Veliko zdravil in injekcij","Reševalni avto"],"Pogosto moramo tudi improvizirati, to pomeni, da si pomagamo s tem, kar imamo."],
["p","Kako dolgo nudimo prvo pomoč?","Do prihoda ekipe nujne medicinske pomoči ali do menjave",["Pet minut","Dokler nam ni dolgčas"],"Pomagamo, dokler ne pridejo reševalci, dokler ne dobimo menjave ali dokler ne omagamo."],
["p","Katero številko pokličemo, kadar potrebujemo reševalce?","112",["113","123"],"Za reševalce kličemo 112!"],
["p","Kateri podatki so pomembni, ko kličemo nujno medicinsko pomoč?","Kdo kliče, kaj se je zgodilo, kje, koliko je poškodovanih in kakšne so poškodbe",["Kakšne barve je reševalni avto","Kateri je naš najljubši film"],"Povej tudi razmere na kraju in kakšno pomoč potrebuješ."],
["p","Kaj naredimo najprej, preden pristopimo do ponesrečenca?","Poskrbimo za svojo varnost",["Takoj stečemo k njemu","Naredimo fotografijo"],"Poskrbi za svojo varnost, za varnost poškodovanca in za varnost vseh, ki so tam."],
["p","Kako ugotovimo, ali je poškodovanec pri zavesti?","Primemo ga za ramena, ga nežno stresemo in glasno ogovorimo",["Močno ga poščegetamo","Pustimo ga pri miru"],"Za ramena, nežno stresanje in glasen poziv."],
["p","Kaj naredimo, ko nekdo omedli?","Poležemo ga, mu dvignemo noge in omogočimo svež zrak",["Posadimo ga na stol","Obrnemo ga na glavo"],"Odpnemo mu ovratnik in razrahljamo pas."],
["p","Kako se imenuje položaj za nezavestnega?","Stabilni bočni položaj",["Stabilni hrbtni položaj","Položaj leteče ptice"],"Nezavestnega, ki diha, položimo v stabilni bočni položaj."],
["p","Kakšno je razmerje pri oživljanju odraslih?","30 masaž in 2 vpiha",["2 masaži in 30 vpihov","10 masaž in 10 vpihov"],"Pri oživljanju odraslih: 30 masaž srca in 2 vpiha."],
["p","S čim se zaščitimo pri oživljanju?","Z obrazno masko",["S smučarsko masko","S kapo"],"Pri vpihih uporabimo obrazno masko."],
["p","Če ne znaš dati vpihov, kaj narediš pri osebi, ki ne diha?","Izvajamo neprekinjeno masažo srca",["Počakamo, da se sama zbudi","Damo ji piti vodo"],"Če nočeš ali ne znaš dati vpihov, masiraj srce brez prekinitve."],
["p","Kaj naredimo, če ima nekdo lažjo zaporo dihalne poti (se mu zaleti)?","Spodbujamo ga, da se odkašlja",["Damo mu piti","Postavimo ga na glavo"],"Kašelj je najboljše zdravilo za zaleteno hrano."],
["p","Kako pravilno shranjujemo zdravila?","Na hladnem in temnem, izven dosega otrok",["Na sončnem oknu","Na tleh v otroški sobi"],"Zdravila shranimo, na primer, na višji polici v omari."],
["p","Zakaj je nevaren skok na glavo v plitvo vodo?","Ker se lahko poškodujeta hrbtenica in glava",["Ker je voda mokra","Ker se zmočijo lasje"],"V plitvo vodo nikoli ne skači na glavo."],
["p","Za kaj uporabljamo trikotne rute?","Za obveze, imobilizacijo in začasno ustavitev krvavitve",["Za pokrivanje glave pri soncu","Za brisanje tal"],"Trikotna ruta je zelo uporabna: obveza, imobilizacija in ustavljanje krvavitve."],
["p","Kaj dosežemo z imobilizacijo?","Poškodovani del telesa se ne premika",["Poškodovani del se hitreje premika","Poškodovani del se ohladi"],"Imobilizacija pomeni: mirujoč poškodovani del."],
["p","S čim pokrijemo vsako rano?","S sterilno gazo",["Z blatom","Z mokrim papirjem"],"Vsako rano pokrijemo s sterilno gazo."],
["p","Kako oskrbimo manjše poškodbe, na primer vrezninico na prstu?","Rano operemo s čisto vodo in nanjo namestimo obliž",["Rano zalijemo s sokom","Rano pustimo odprto"],"Čista voda in obliž."],
["p","Kako oskrbimo rano zaradi ugriza živali?","Obrišemo slino, rano speremo in obvežemo ter gremo k zdravniku",["Rano pustimo, da se posuši","Rano ovijemo v papir"],"Pri ugrizu vedno k zdravniku!"],
["p","Kako ustavimo krvavitev iz nosu?","Oseba sede, se nagne naprej in stisne nosnici",["Oseba leže vrže glavo nazaj","Oseba teče po stopnicah"],"Na tilnik lahko položimo hladen obkladek."],
["p","Ali lahko osebo s poškodovano hrbtenico premikamo?","Samo če je neposredno ogrožena, na primer zaradi ognja",["Da, vedno takoj","Ne, nikoli, niti v ognju"],"Hrbtenice ne premikamo, razen če je oseba neposredno ogrožena."],
["p","Kako se imenuje pripomoček za oskrbo opeklin?","Opeklinski obkladek",["Opeklinska zavesa","Opeklinski ščit"],"Opekline oskrbimo z opeklinskim obkladkom."],
["p","Kako se imenuje postopek razvrščanja poškodovanih glede na težo poškodbe in nujnost oskrbe?","Triaža",["Triatlon","Tropikalna"],"Triaža razvrsti poškodovane po tem, kdo najprej potrebuje pomoč."],
["p","Kdo je triažer?","Oseba, ki izvaja triažo",["Oseba, ki vozi reševalni avto","Oseba, ki prodaja zdravila"],"Triažer razvršča poškodovane."],
["p","S katerimi barvami označujemo triažne skupine?","Rdeča, rumena, zelena in črna",["Bela, roza, siva in oranžna","Modra, vijolična in rjava"],"Triažne barve: rdeča, rumena, zelena in črna."],
["p","Kako označujemo poškodovane pri triaži?","S posebnimi triažnimi kartončki",["S samolepilnimi nalepkami z živalmi","S pisanjem po roki"],"Poškodovane označimo s triažnimi kartončki."],
["p","Kaj je najpogostejši način zaustavljanja večjih krvavitev?","Kompresijska obveza",["Mokra brisača","Poljub in obliž"],"Večjo krvavitev ustavimo s kompresijsko obvezo."],
["p","Kaj pomeni kratica AED?","Avtomatski eksterni defibrilator",["Avtomatski električni drsnik","Aparat za enostavno dihanje"],"AED je naprava, ki pomaga pri oživljanju in ti pove, kaj naj narediš."],

function parseBoard(txt){

  });
  return by;
}

  '<div class="top"><button class="btn small white" data-act="home">Domov</button><h2>Dvoboj s kodo</h2><span></span></div>'+
  stage({g:'happy',f:'grin'})+
  '<div class="panel"><p>Vsi, ki vpišejo <b>isto kodo</b>, dobijo <b>ista vprašanja</b> v istem vrstnem redu. Kdo bo imel več točk? Pri enakem številu točk zmaga hitrejši.</p></div>'+
  '<div class="panel"><label for="code">Koda dvoboja</label><div class="codebox"><input type="text" id="code" maxlength="16" value="'+esc(DUELCODE)+'" placeholder="npr. HIDRANT7" autocomplete="off" autocapitalize="characters"><button class="btn small" data-act="newcode">Naključna</button></div></div>'+
  '<button class="btn red big" data-act="duelgo">Začni dvoboj (10 vprašanj)</button>'+
  (DUELCODE?boardHtml(DUELCODE.trim().toUpperCase()):'')+
  '<p class="note center">Mentor lahko vsem pove kodo. Rezultate primerjate tako, da si pošljete rezultat s tipko Kopiraj.</p>';
}
function vTeam(){
  var names='';
  for(var i=0;i<TS.n;i++)names+='<div><label for="tn'+i+'" style="color:'+TEAMCOL[i]+'">Ekipa '+(i+1)+'</label><input type="text" id="tn'+i+'" maxlength="14" value="'+esc(TS.names[i])+'" autocomplete="off"></div>';
  function seg(act,vals,cur){return '<div class="seg">'+vals.map(function(v){return '<button class="btn'+(v===cur?' on':'')+'" data-act="'+act+'" data-n="'+v+'">'+v+'</button>'}).join('')+'</div>'}
  return ''+
  '<div class="top"><button class="btn small white" data-act="home">Domov</button><h2>Ekipe</h2><span></span></div>'+
  stage({g:'cheer',f:'grin'})+
  '<div class="panel"><p>Ekipe se menjavajo pri istem zaslonu. Za pravilen odgovor dobi ekipa točko. Primerno za gasilski krožek ali projektor.</p></div>'+
  '<div class="panel"><label>Število ekip</label>'+seg('cnt',[2,3,4],TS.n)+'<div style="height:12px"></div><label>Vprašanj na ekipo</label>'+seg('per',[3,5,8],TS.per)+'</div>'+
  '<div class="panel" style="display:flex;flex-direction:column;gap:10px">'+names+'</div>'+
  '<button class="btn red big" data-act="teamgo">Začni igro</button>';
}

/* ================= IGRA ================= */
function startSolo(t){
  var rnd=Math.random,n=Math.min(10,poolOf(t).length);
  var qs=pick(poolOf(t),n,rnd,weightOf);
  G={mode:'solo',topic:t,queue:qs.map(function(q){return makeItem(q,rnd)}),total:qs.length,ok:0,streak:0,gain:0,ans:null,log:[],missed:[],xp0:S.xp};
  go('play');
}
function startDuel(code){
  var rnd=mulberry(hash('gasilci-'+code)),qs=pick(QS,10,rnd,null);
  G={mode:'duel',code:code,queue:qs.map(function(q){return makeItem(q,rnd)}),total:qs.length,ok:0,streak:0,gain:0,ans:null,log:[],missed:[],xp0:S.xp,t0:Date.now()};
  go('play');
}
function startTeam(){
  var teams=[];
  for(var i=0;i<TS.n;i++)teams.push({name:(TS.names[i]||'').trim()||('Ekipa '+(i+1)),score:0});
  var rnd=Math.random,qs=pick(QS,TS.n*TS.per,rnd,null);
  G={mode:'team',teams:teams,per:TS.per,queue:qs.map(function(q){return makeItem(q,rnd)}),total:qs.length,ok:0,streak:0,gain:0,ans:null,log:[],missed:[],xp0:S.xp};
  go('play');
}
function say(t){try{var l=document.getElementById('live');if(l)l.textContent=t}catch(e){}}
function answer(i,forced){
  if(!G||G.ans)return;
  var it=G.queue[0],ok=forced!==undefined?forced:i===it.ci,idx=G.total-G.queue.length,xpB=S.xp;
  G.ans={xpB:xpB,gain:0,rankUp:false,i:i,ok:ok,praise:rpick(PRAISE),oops:rpick(OOPS),boom:rpick(BOOMS),bonus:false};
  if(G.mode!=='team'&&!it.retry){
    var s=S.q[it.q.id]||(S.q[it.q.id]={box:0,seen:0});
    s.seen++;s.box=ok?Math.min(5,s.box+1):Math.max(0,s.box-2);
  }
  if(ok&&!it.retry&&G.mode!=='team'){
    G.ok++;G.streak++;G.gain++;S.xp++;
    if(G.streak%5===0){G.gain+=2;S.xp+=2;G.ans.bonus=true}
  }
  if(ok&&G.mode==='team'){G.teams[idx%G.teams.length].score++}
  if(!ok){G.streak=0;if(!it.retry&&G.mode!=='team')G.missed.push(it.q)}
  if(!it.retry)G.log.push(ok);
  G.ans.gain=S.xp-xpB;G.ans.rankUp=rankIdx(S.xp)>rankIdx(xpB);
  save();beep(ok);render();
  say((ok?'Pravilno! ':'Napačno. Pravilno je: '+it.q.right+'. ')+(G.ans.rankUp?'Nov čin: '+RANKS[rankIdx(S.xp)].n+'. ':'')+'Zapomni si: '+it.q.fact);
  try{var nb=document.getElementById('nx');if(nb)nb.focus({preventScroll:true});var f=document.getElementById('fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}
}
function nextQ(){
  var it=G.queue.shift(),A=G.ans;
  if(G.mode==='solo'&&!it.retry&&!A.ok){G.queue.push(makeItem(it.q,Math.random,true));G.total=Math.max(G.total,G.log.length+G.queue.length)}
  G.ans=null;
  if(!G.queue.length){finish();return}
  render();try{window.scrollTo(0,0);var q=document.getElementById('qt');if(q)q.focus({preventScroll:true})}catch(e){}
}
function finish(){
  var R={},n=G.total;
  if(G.mode==='solo'){
    var base=Math.min(G.ok,10),before=rankIdx(G.xp0),after=rankIdx(S.xp);
    R.stars=base>=9?3:base>=7?2:base>=4?1:0;R.before=before;R.after=after;R.rankUp=after>before;
    G.total=G.log.length;
  }else if(G.mode==='duel'){
    R.time=Math.round((Date.now()-G.t0)/1000);R.stars=G.ok>=9?3:G.ok>=7?2:G.ok>=4?1:0;
    R.line='Gasilski dvoboj '+G.code+': '+nick()+', '+G.ok+'/'+n+' točk v '+R.time+' s';
    var arr=S.duel[G.code]||(S.duel[G.code]=[]);arr.push({nick:nick(),score:G.ok,time:R.time});
    if(arr.length>30)arr.splice(0,arr.length-30);
  }
  G.result=R;save();go('result');
}

/* ================= DOGODKI ================= */
var H={
  home:function(){go('home')},
  editnick:function(){EDITNICK=true;render();try{var n=document.getElementById('nick');if(n){n.focus();n.select()}}catch(e){}},
  savenick:function(){EDITNICK=false;render()},
  play:function(d){startSolo(d.t)},
  ans:function(d){answer(+d.i)},
  tpick:function(d){
    var it=G&&G.queue[0];if(!it||!it.topo||it.st!==1||G.ans)return;
    it.s1=+d.i;it.s1ok=it.s1===it.ci;it.st=2;beep(it.s1ok);render();
    say((it.s1ok?'Pravilno. ':'Napačno. ')+'Zdaj najdi znak '+it.q.right+' na zemljevidu.');
    try{var q=document.getElementById('qt');if(q)q.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
  },
  tmap:function(d){
    var it=G&&G.queue[0];if(!it||!it.topo||it.st!==2||G.ans)return;
    it.tap=+d.s;answer(0,it.s1ok&&it.tap===it.q.sym);
  },
  next:nextQ,
  listen:function(){var it=G&&G.queue[0];if(it)speak(it.topo?it.q.q:it.q.q+'. '+it.opts.join('. '))},
  rank:function(){go('rank')},
  board:function(){go('board')},
  clearboard:function(){S.paste='';save();render()},
  duel:function(){go('duel')},
  team:function(){go('team')},
  snd:function(){S.snd=!S.snd;save();render()},
  dice:function(){S.nick=rpick(ADJ)+' '+rpick(NOUN);save();render();try{var n=document.getElementById('nick');if(n)n.focus()}catch(e){}},
  newcode:function(){DUELCODE=rpick(CODES)+Math.floor(Math.random()*90+10);render()},
  duelgo:function(){var c=(DUELCODE||'').trim().toUpperCase();if(!c){DUELCODE=rpick(CODES)+Math.floor(Math.random()*90+10);c=DUELCODE}DUELCODE=c;startDuel(c)},
  teamgo:startTeam,
  cnt:function(d){TS.n=+d.n;render()},
  per:function(d){TS.per=+d.n;render()},
  again:function(){if(!G)return go('home');if(G.mode==='solo')startSolo(G.topic);else if(G.mode==='duel')go('duel');else go('team')},
  copy:function(){
    var el=document.getElementById('rc'),st=document.getElementById('st');if(!el)return;
    function ok(){STATUS='Kopirano!';if(st)st.textContent=STATUS}
    function no(){try{el.focus();el.select()}catch(e){}STATUS='Označeno. Pritisni Ctrl+C.';if(st)st.textContent=STATUS}
    try{navigator.clipboard.writeText(el.value).then(ok,no)}catch(e){no()}
  },
  reset:function(){CONFIRM=true;render()},
  resetno:function(){CONFIRM=false;render()},
  resetyes:function(){S={nick:S.nick,xp:0,q:{},duel:{},snd:S.snd};save();CONFIRM=false;render()}
};
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=H[b.getAttribute('data-act')];if(f)f({t:b.getAttribute('data-t'),i:b.getAttribute('data-i'),n:b.getAttribute('data-n'),s:b.getAttribute('data-s')});
});
app.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='nick'){S.nick=t.value.slice(0,16);save()}
  else if(id==='code'){DUELCODE=t.value}
  else if(id==='paste'){S.paste=t.value;save();var o=document.getElementById('bout');if(o)o.innerHTML=boardOut()}
  else if(/^tn\d$/.test(id)){TS.names[+id.charAt(2)]=t.value}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('thit')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
  if(view!=='play'||!G||G.ans||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  var k=String(e.key||'').toLowerCase(),i='123'.indexOf(k);if(i<0)i='abc'.indexOf(k);
  if(i>=0&&k.length===1&&G.queue[0]&&i<G.queue[0].opts.length){var q0=G.queue[0];e.preventDefault();if(q0.topo){if(q0.st===1)H.tpick({i:i})}else answer(i)}
});
try{window.speechSynthesis&&(speechSynthesis.onvoiceschanged=function(){})}catch(e){}

render();
})();
</script>
